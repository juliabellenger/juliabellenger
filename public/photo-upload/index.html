<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Photo Uploads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pinyon+Script&family=Cormorant+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="upload-core.css?v=5">
</head>
<body>

  <header>
    <div class="header-text">
      <div class="page-title">Photo Uploads</div>
      <div class="divider"></div>
      <p class="date-text"><em>friends that share remember</em></p>
    </div>
  </header>

  <main>
    <div class="project-card">
      <img class="project-qr" src="../wedding-qr-2.png" alt="QR code for Julia and Tom wedding photo upload" />
      <div class="project-info">
        <div class="project-name">Julia &amp; Tom</div>
        <div class="project-meta">Wedding Photos</div>
        <div class="project-actions">
          <a class="btn btn-primary" href="wedding.html">Upload Photos</a>
          <a class="btn btn-secondary" href="https://console.firebase.google.com/project/bellenger-wedding-photos/storage" target="_blank" rel="noopener">Admin View</a>
        </div>
      </div>
    </div>

    <div class="project-card">
      <img class="project-qr" src="../share-qr-2.png" alt="QR code for shared photo upload" />
      <div class="project-info">
        <div class="project-name">Photo Share</div>
        <div class="project-meta">Shared Photos</div>
        <div class="project-actions">
          <a class="btn btn-primary" href="share.html">Upload Photos</a>
          <a class="btn btn-secondary" href="https://console.firebase.google.com/project/bellenger-wedding-photos/storage" target="_blank" rel="noopener">Admin View</a>
        </div>
      </div>
    </div>
  </main>

  <footer>Made with <span>♡</span> for special days</footer>

</body>
</html>
